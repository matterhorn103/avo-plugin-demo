[project]
# These fields are required:
name = "plugin-demo"
version = "0.1.0"
description = "A simple Python plugin for Avogadro 2 to demonstrate the revamped plugin API in v2.0 onwards"
# These fields are optional:
readme = "README.md"
requires-python = ">=3.10"  # Please follow the Avogadro Python version policy!
dependencies = [
    "platformdirs>=4.2.0",
]  # Dependencies that should be sourced from PyPI, the Python Package Index

# Some build system is always required, but you are welcome to choose whichever
[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

# Define the entry point for the plugin
# The key is the command, which must be the plugin's name, prefixed with `avogadro-`
# The entry point itself can be any function you like from within your package
[project.scripts]
avogadro-plugin-demo = "plugin_demo:main"

# The [tool.pixi] tables are only necessary if your plugin needs to use Conda dependencies
[tool.pixi]
channels = [ "conda-forge" ]

[tool.pixi.dependencies]
xtb = ">=6.7.1,<7"

# The [tool.avogadro] table tells Avogadro what your plugin needs
[tool.avogadro]
plugin-config = true                # Whether Avogadro should store configuration of your plugin
avogadro-config = [ "MainWindow" ]  # Any other tables from Avogadro's config that your plugin should receive

# List the functionality your plugin provides as entries under the appropriate type
# Each entry must specify a `subcommand`, which is the subcommand used
# by Avogadro when running your plugin
# e.g. the first entry will be called using `avogadro-plugin-demo get-charges [ARGS]`
[[tool.avogadro.charges]]
subcommand = "get-charges"
method-name = "Löwdiken analysis"

[[tool.avogadro.commands]]
subcommand = "transmute"
path.menu = "Build"  # The menu within which the command's menu entry should appear
path.entry = { label = "Transmute into gold", priority = 300 }  # The text for the command's menu entry and its position within "Build"

[[tool.avogadro.commands]]
subcommand = "movex"
path.menu = "Extensions"
path.submenu = { menu = "Demo", priority = 500 }  # Priority determines the position of "Demo" within "Extensions"
path.entry = { label = "Move X", priority = 220 }  # Priority determines the position of "Move X" within "Demo"

[[tool.avogadro.commands]]
subcommand = "movey"
path.menu = "Extensions"
path.submenu = { menu = "Demo", priority = 500 }
path.entry = { label = "Move Y", priority = 210 }

[[tool.avogadro.commands]]
subcommand = "move"
path.menu = "Extensions"
path.submenu = { menu = "Demo", priority = 500 }
path.entry = { label = "Move", priority = 200 }

[[tool.avogadro.commands]]
subcommand = "hello"
path.menu = "Extensions"
path.submenu = { menu = "Demo", priority = 500 }
path.entry = { label = "Say Hello", priority = 100 }

[[tool.avogadro.energy]]
subcommand = "aura"
method-name = "Molecular aura"

[[tool.avogadro.formats]]
subcommand = "lor"
format-name = "Lorentzian output format"

[[tool.avogadro.generators]]
subcommand = "qavocado"
program-name = "Quantum Avocado"
